<!-- Product Comparison Widget -->
<div th:fragment="compare" xmlns:th="http://www.w3.org/1999/xhtml">

<style>
/* ── Compare badge (floating button) ── */
.compare-badge {
    position: fixed;
    bottom: 90px;
    left: 20px;
    z-index: 1055;
    background: linear-gradient(135deg, #E8611D, #B8480F);
    color: #fff;
    border: none;
    border-radius: 28px;
    padding: 10px 18px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(232,97,29,0.4);
    display: none;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
}
.compare-badge:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(232,97,29,0.5); }

/* ── Compare panel ── */
.compare-panel {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 1055;
    background: #fff;
    border-top: 1px solid #E7E7EA;
    box-shadow: 0 -4px 24px rgba(0,0,0,0.12);
    border-radius: 16px 16px 0 0;
    transform: translateY(100%);
    transition: transform 0.35s ease;
    max-height: 75vh;
    overflow-y: auto;
}
.compare-panel.open { transform: translateY(0); }

.compare-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid #E7E7EA;
    position: sticky;
    top: 0;
    background: #fff;
    border-radius: 16px 16px 0 0;
    z-index: 1;
}
.compare-panel-header h6 { margin: 0; font-weight: 700; font-size: 0.95rem; color: #2d3436; }
.compare-panel-header .compare-actions { display: flex; gap: 8px; align-items: center; }
.compare-panel-header .btn-clear {
    background: none; border: none; color: #C33636; font-size: 0.78rem;
    font-weight: 600; cursor: pointer; padding: 4px 8px;
}
.compare-panel-header .btn-close-panel {
    background: none; border: none; color: #8A8A93; font-size: 1.2rem;
    cursor: pointer; padding: 4px; line-height: 1;
}

.compare-panel-body {
    display: flex;
    gap: 1px;
    background: #E7E7EA;
}

.compare-slot {
    flex: 1;
    background: #fff;
    padding: 16px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
}
.compare-slot img {
    width: 100%;
    max-width: 160px;
    height: 120px;
    object-fit: contain;
    border-radius: 10px;
    background: #FAFAFA;
    margin-bottom: 10px;
}
.compare-slot .slot-name {
    font-weight: 600;
    font-size: 0.88rem;
    color: #2d3436;
    margin-bottom: 4px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
.compare-slot .slot-price {
    font-weight: 700;
    font-size: 0.95rem;
    color: #E8611D;
    margin-bottom: 6px;
}
.compare-slot .slot-rating {
    display: flex;
    gap: 2px;
    justify-content: center;
    margin-bottom: 10px;
    font-size: 0.85rem;
}
.compare-slot .slot-rating .bi-star-fill { color: #F2B705; }
.compare-slot .slot-rating .bi-star { color: #ccc; }

.compare-slot .slot-actions { display: flex; gap: 8px; }
.compare-slot .btn-view-product {
    background: #0E0E11; color: #fff; border: none; border-radius: 8px;
    padding: 6px 14px; font-size: 0.75rem; font-weight: 600; cursor: pointer;
    text-decoration: none; display: inline-block;
}
.compare-slot .btn-view-product:hover { background: #2a2a30; color: #fff; }
.compare-slot .btn-remove {
    background: #f0f0f0; color: #C33636; border: none; border-radius: 8px;
    padding: 6px 10px; font-size: 0.75rem; cursor: pointer;
}
.compare-slot .btn-remove:hover { background: #fde8e8; }

.compare-slot-empty {
    flex: 1;
    background: #fff;
    padding: 40px 16px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #aaa;
    font-size: 0.85rem;
}
.compare-slot-empty i { font-size: 2rem; margin-bottom: 8px; color: #ddd; }

/* ── Compare button on cards ── */
.btn-compare {
    background: transparent;
    border: 1px solid #E7E7EA;
    border-radius: 8px;
    padding: 4px 8px;
    font-size: 0.75rem;
    color: #8A8A93;
    transition: all 0.2s;
    cursor: pointer;
    line-height: 1;
}
.btn-compare:hover { background: #E8611D; border-color: #E8611D; color: #fff; }
.btn-compare.active { background: #E8611D; border-color: #E8611D; color: #fff; }

/* ── Mobile adjustments ── */
@media (max-width: 982px) {
    .compare-badge {
        bottom: calc(70px + env(safe-area-inset-bottom, 4px));
    }
}
@media (max-width: 768px) {
    .compare-slot img { height: 90px; max-width: 120px; }
    .compare-slot { padding: 12px 8px; }
    .compare-slot .slot-name { font-size: 0.8rem; }
    .compare-badge { left: 12px; padding: 8px 14px; font-size: 0.8rem; }
}

/* ── Dark mode ── */
body.dark-mode .compare-panel { background: #1a1a1e; border-top-color: #3A3A40; }
body.dark-mode .compare-panel-header { background: #1a1a1e; border-bottom-color: #3A3A40; }
body.dark-mode .compare-panel-header h6 { color: #E7E7EA; }
body.dark-mode .compare-panel-body { background: #3A3A40; }
body.dark-mode .compare-slot { background: #1a1a1e; }
body.dark-mode .compare-slot img { background: #2a2a30; }
body.dark-mode .compare-slot .slot-name { color: #E7E7EA; }
body.dark-mode .compare-slot .slot-rating .bi-star { color: #555; }
body.dark-mode .compare-slot .btn-remove { background: #2a2a30; }
body.dark-mode .compare-slot-empty { background: #1a1a1e; color: #666; }
body.dark-mode .compare-slot-empty i { color: #444; }
body.dark-mode .btn-compare { border-color: #3A3A40; color: #8A8A93; }
body.dark-mode .btn-compare:hover,
body.dark-mode .btn-compare.active { background: #E8611D; border-color: #E8611D; color: #fff; }
</style>

<!-- Compare badge -->
<button class="compare-badge" id="compareBadge" onclick="openComparePanel()">
    <i class="bi bi-arrow-left-right"></i>
    <span>Compare (<span id="compareBadgeCount">0</span>)</span>
</button>

<!-- Compare panel -->
<div class="compare-panel" id="comparePanel">
    <div class="compare-panel-header">
        <h6><i class="bi bi-arrow-left-right me-2"></i>Compare Products</h6>
        <div class="compare-actions">
            <button class="btn-clear" onclick="clearCompare()">Clear All</button>
            <button class="btn-close-panel" onclick="closeComparePanel()">&times;</button>
        </div>
    </div>
    <div class="compare-panel-body" id="comparePanelBody">
        <!-- Slots rendered by JS -->
    </div>
</div>

<script>
(function() {
    var STORAGE_KEY = 'bsCompareProducts';

    function getCompareProducts() {
        try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
        catch(e) { return []; }
    }

    function saveCompareProducts(products) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
        updateCompareUI();
    }

    function renderStars(rating) {
        var r = Math.round(rating || 0);
        var html = '';
        for (var i = 1; i <= 5; i++) {
            html += '<i class="bi ' + (i <= r ? 'bi-star-fill' : 'bi-star') + '"></i>';
        }
        return html;
    }

    function renderSlot(product) {
        return '<div class="compare-slot">' +
            '<img src="' + product.image + '" alt="' + product.name + '">' +
            '<div class="slot-name">' + product.name + '</div>' +
            '<div class="slot-price">' + product.price + '</div>' +
            '<div class="slot-rating">' + renderStars(product.rating) + '</div>' +
            '<div class="slot-actions">' +
                '<a href="/product/' + product.id + '" class="btn-view-product">View</a>' +
                '<button class="btn-remove" onclick="removeFromCompare(' + product.id + ')" title="Remove">' +
                    '<i class="bi bi-x-lg"></i>' +
                '</button>' +
            '</div>' +
        '</div>';
    }

    function renderEmptySlot() {
        return '<div class="compare-slot-empty">' +
            '<i class="bi bi-plus-circle"></i>' +
            '<span>Add a product to compare</span>' +
        '</div>';
    }

    window.updateCompareUI = function() {
        var products = getCompareProducts();
        var badge = document.getElementById('compareBadge');
        var countEl = document.getElementById('compareBadgeCount');
        var body = document.getElementById('comparePanelBody');

        // Badge
        if (products.length > 0) {
            badge.style.display = 'flex';
            countEl.textContent = products.length;
        } else {
            badge.style.display = 'none';
            closeComparePanel();
        }

        // Panel body
        var html = '';
        if (products.length >= 1) html += renderSlot(products[0]); else html += renderEmptySlot();
        if (products.length >= 2) html += renderSlot(products[1]); else html += renderEmptySlot();
        body.innerHTML = html;

        // Sync button states on page
        document.querySelectorAll('.btn-compare').forEach(function(btn) {
            var id = String(btn.getAttribute('data-id'));
            var inList = products.some(function(p) { return String(p.id) === id; });
            btn.classList.toggle('active', inList);
        });
    };

    window.addToCompare = function(btn) {
        if (event) { event.preventDefault(); event.stopPropagation(); }
        var products = getCompareProducts();
        var id = String(btn.getAttribute('data-id'));

        // Check duplicate
        if (products.some(function(p) { return String(p.id) === id; })) {
            if (typeof Swal !== 'undefined') {
                Swal.fire({ toast: true, position: 'top-end', icon: 'info',
                    title: 'Already in comparison', showConfirmButton: false, timer: 1500 });
            }
            return;
        }

        // Check max
        if (products.length >= 2) {
            if (typeof Swal !== 'undefined') {
                Swal.fire({ toast: true, position: 'top-end', icon: 'warning',
                    title: 'Remove a product first (max 2)', showConfirmButton: false, timer: 2000 });
            }
            return;
        }

        products.push({
            id: btn.getAttribute('data-id'),
            name: btn.getAttribute('data-name'),
            price: btn.getAttribute('data-price'),
            image: btn.getAttribute('data-image'),
            rating: parseFloat(btn.getAttribute('data-rating') || '0')
        });

        saveCompareProducts(products);

        // Auto-open panel when 2 products are selected
        if (products.length === 2) {
            openComparePanel();
        } else if (typeof Swal !== 'undefined') {
            Swal.fire({ toast: true, position: 'top-end', icon: 'success',
                title: 'Added! Select one more to compare', showConfirmButton: false, timer: 1500 });
        }
    };

    window.removeFromCompare = function(id) {
        var products = getCompareProducts().filter(function(p) { return String(p.id) !== String(id); });
        saveCompareProducts(products);
        if (products.length === 0) closeComparePanel();
    };

    window.clearCompare = function() {
        localStorage.removeItem(STORAGE_KEY);
        updateCompareUI();
        closeComparePanel();
    };

    window.openComparePanel = function() {
        var products = getCompareProducts();
        if (products.length === 0) return;
        document.getElementById('comparePanel').classList.add('open');
    };

    window.closeComparePanel = function() {
        document.getElementById('comparePanel').classList.remove('open');
    };

    // Initialize on page load
    document.addEventListener('DOMContentLoaded', function() {
        updateCompareUI();
    });
})();
</script>

</div>
