<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - BlackSpace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .error-card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            padding: 50px 40px;
            max-width: 550px;
            width: 100%;
            text-align: center;
        }
        .error-icon {
            font-size: 5rem;
            color: #E8611D;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
        .error-code {
            font-size: 4rem;
            font-weight: 800;
            color: #2d3436;
            margin: 10px 0 5px;
        }
        .error-message {
            color: #636e72;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }
        .btn-home {
            background: linear-gradient(135deg, #E8611D, #ff8c42);
            border: none;
            color: #fff;
            padding: 12px 35px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(232,97,29,0.4);
            color: #fff;
        }
        .error-details {
            margin-top: 25px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            font-size: 0.85rem;
            color: #888;
        }
    </style>
</head>
<body>
<div class="error-card">
    <i class="bi bi-exclamation-triangle-fill error-icon"></i>
    <div class="error-code" th:text="${status} ?: '500'">500</div>
    <h4 class="mb-2">Oops! Something went wrong</h4>
    <p class="error-message" th:text="${error} ?: 'An unexpected error occurred. Please try again later.'">
        An unexpected error occurred. Please try again later.
    </p>
    <a th:href="@{/}" class="btn-home">
        <i class="bi bi-house-door me-2"></i>Back to Homepage
    </a>
    <div class="error-details">
        <i class="bi bi-info-circle me-1"></i>
        Our team has been notified and is looking into this.
    </div>
</div>
</body>
</html>
