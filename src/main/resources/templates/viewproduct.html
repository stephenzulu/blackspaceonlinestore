<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" th:href="@{'/uploads/favicon/' + ${siteSettings.siteFavicon}}">

    <title th:if="${product != null and store != null}"
           th:text="${product.name + ' | ' + store.name}">
        View Product
    </title>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="product" />
    <meta property="og:title" th:content="${product.name}" />
    <meta property="og:description" th:content="${product.shortdescription != null ? product.shortdescription : product.description}" />
    <meta property="og:url" th:content="${currentUrl}" />
    <meta property="og:image" th:content="${baseUrl + '/uploads/products/images/' + #strings.arraySplit(product.imageurls, ',')[0]}" />
    <meta property="og:site_name" th:content="${siteSettings.siteName}" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" th:content="${product.name}" />
    <meta name="twitter:description" th:content="${product.shortdescription != null ? product.shortdescription : product.description}" />
    <meta name="twitter:image" th:content="${baseUrl + '/uploads/products/images/' + #strings.arraySplit(product.imageurls, ',')[0]}" />

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">



    <style>
        .banner-img {
            width: 100%;
            height: 260px;
            object-fit: cover;
        }

        .store-logo {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            margin-top: -55px;
            background: #fff;
            border: 4px solid #fff;
            object-fit: cover;
        }

        .product-image {
            width: 100%;
            max-height: 250px;
            object-fit: contain;
            background: #F6F6F4;
        }

        .price {
            font-size: 1.5rem;
            font-weight: bold;
            color: #0F7A4E;
        }

        .thumb-img {
            height: 80px;
            object-fit: cover;
            cursor: pointer;
            border-radius: 6px;
            border: 2px solid transparent;
        }

        .thumb-img:hover {
            border-color: #E8611D;
        }

        .carousel-control-prev-icon,
        .carousel-control-next-icon {
            background-color: rgba(15, 122, 78, 0.7);
            border-radius: 50%;
            padding: 10px;
            background-size: 100%, 100%;
        }

        .carousel-control-prev-icon::after,
        .carousel-control-next-icon::after {
            content: '';
        }

    </style>
</head>
<body>

<!-- Include navbar -->
<div th:replace="fragments/navbar :: topbar"></div>

<!-- ================= BANNER ================= -->
<div class="container-fluid p-0 position-relative">
    <img loading="lazy" class="banner-img"
         th:if="${store != null and store.storebanner != null and store.storebanner != ''}"
         th:src="@{'/uploads/stores/' + ${store.storebanner}}"
         alt="Store Banner">

    <img loading="lazy" class="banner-img"
         th:unless="${store != null and store.storebanner != null and store.storebanner != ''}"
         th:src="@{/store/banner/banner.jpeg}"
         alt="Store Banner">


    <!-- Call & Email Icons -->
    <div class="banner-contact position-absolute bottom-0 end-0 p-3 d-flex gap-3"  style="background: rgba(0,0,0,0.5); border-top-right-radius:8px;">
        <!-- Phone -->
        <a class="btn btn-sm d-flex align-items-center">
            <i class="bi bi-eye me-1 text-white"></i>
            <span class="text-white" th:text="${product.views}">0</span>
        </a>
        <!-- Email -->
        <a th:if="${store != null and store.email != null and store.email != ''}"
           th:href="'mailto:' + ${store.email}"
           class="btn btn-sm btn-outline-light d-flex align-items-center">
            <i class="bi bi-envelope me-1"></i>
            <span th:text="${store.email}">info@blackspace.com</span>
        </a>


    </div>


</div>

<!-- ================= STORE HEADER ================= -->
<div class="container mt-3 p-0 position-relative">
    <div class="d-flex align-items-center">
        <!-- Store Logo -->
        <img loading="lazy" class="store-logo me-3"
             th:if="${store != null and store.storelogo != null and store.storelogo != ''}"
             th:src="@{'/uploads/stores/' + ${store.storelogo}}"
             alt="Store Logo">
        <img loading="lazy" class="store-logo me-3"
             th:unless="${store != null and store.storelogo != null and store.storelogo != ''}"
             th:src="@{/store/logo/logo.jpeg}"
             alt="Store Logo">

        <!-- Store Name -->
        <div class="flex-grow-1">
            <h2 class="mb-0" th:text="${store != null} ? ${store.name} : 'Store'">Store </h2>
        </div>
    </div>
</div>

<!-- ================= BREADCRUMB ================= -->
<div class="container mt-3">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb bg-light p-2 rounded">
            <li class="breadcrumb-item">
                <a th:href="@{/}">
                    <i class="bi bi-house-door-fill me-1"></i>
                </a>
            </li>
            <li class="breadcrumb-item">
                <a th:href="@{/stores}">Stores</a>
            </li>
            <li class="breadcrumb-item active" aria-current="page"
                th:text="${store != null} ? ${store.name} : 'Store'">Store</li>
        </ol>
    </nav>
</div>


<!-- ================= PRODUCT VIEW ================= -->
<div class="container mt-5">
    <div class="row g-4">

        <!-- Product Images -->
        <div class="col-md-6">

            <div class="container">
                <div class="row">

                    <!-- Left Column -->
                    <div class="col-md-9">
                        <div id="productCarousel" class="carousel slide mb-3">
                            <div class="carousel-inner">
                                <div th:each="img,iter : ${#strings.arraySplit(product.imageurls, ',')}"
                                     class="carousel-item"
                                     th:classappend="${iter.index == 0} ? ' active'">
                                    <img loading="lazy" th:src="@{'/uploads/products/images/'+${img}}"
                                         class="d-block w-100 product-image"
                                         alt="Product Image">
                                </div>
                            </div>

                            <button class="carousel-control-prev" type="button" data-bs-target="#productCarousel"
                                    data-bs-slide="prev">
                                <span class="carousel-control-prev-icon"></span>
                            </button>
                            <button class="carousel-control-next" type="button" data-bs-target="#productCarousel"
                                    data-bs-slide="next">
                                <span class="carousel-control-next-icon"></span>
                            </button>
                        </div>
                    </div>

                    <!-- Right Column -->
                    <div class="col-md-3">
                        <!-- Thumbnails: vertical on md+ screens, horizontal on small screens -->
                        <div class="d-flex flex-row flex-md-column gap-2">
                            <img loading="lazy" th:each="img,iter : ${#strings.arraySplit(product.imageurls, ',')}"
                                 th:src="@{'/uploads/products/images/' + ${img}}"
                                 class="thumb-img"
                                 style="cursor: pointer; width: 60px; height: 60px; object-fit: cover;"
                                 th:onclick="'showSlide(' + ${iter.index} + ')'" />
                        </div>
                         </div>

                </div>
            </div>




            <!-- ================= AUDIO PLAYER ================= -->

            <div th:if="${product.audiourl != null and product.audiourl != ''}" class="mt-4">
                <style>
                    .audio-player {
                        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
                        border-radius: 16px;
                        padding: 20px 24px;
                        color: #fff;
                        box-shadow: 0 8px 30px rgba(0,0,0,0.15);
                    }
                    .audio-player-header {
                        display: flex;
                        align-items: center;
                        gap: 14px;
                        margin-bottom: 16px;
                    }
                    .audio-player-icon {
                        width: 48px; height: 48px; border-radius: 12px;
                        background: linear-gradient(135deg, #E8611D, #ff8c42);
                        display: flex; align-items: center; justify-content: center;
                        font-size: 1.3rem; flex-shrink: 0;
                    }
                    .audio-player-info h6 {
                        margin: 0; color: #fff; font-weight: 600; font-size: 0.95rem;
                    }
                    .audio-player-info small {
                        color: rgba(255,255,255,0.5); font-size: 0.78rem;
                    }
                    .audio-waveform {
                        height: 70px; border-radius: 8px;
                        background: rgba(255,255,255,0.05);
                        margin-bottom: 12px;
                    }
                    .audio-controls {
                        display: flex; align-items: center; gap: 12px;
                    }
                    .audio-play-btn {
                        width: 44px; height: 44px; border-radius: 50%; border: none;
                        background: linear-gradient(135deg, #E8611D, #ff8c42);
                        color: #fff; font-size: 1.2rem; cursor: pointer;
                        display: flex; align-items: center; justify-content: center;
                        transition: all 0.2s; flex-shrink: 0;
                        box-shadow: 0 4px 15px rgba(232,97,29,0.4);
                    }
                    .audio-play-btn:hover {
                        transform: scale(1.08);
                        box-shadow: 0 6px 20px rgba(232,97,29,0.5);
                    }
                    .audio-play-btn.playing {
                        background: linear-gradient(135deg, #0F7A4E, #27ae60);
                        box-shadow: 0 4px 15px rgba(15,122,78,0.4);
                    }
                    .audio-time {
                        display: flex; justify-content: space-between;
                        font-size: 0.75rem; color: rgba(255,255,255,0.45);
                        margin-bottom: 2px;
                    }
                    .audio-progress-wrap {
                        flex: 1; display: flex; flex-direction: column; justify-content: center;
                    }
                    .audio-volume {
                        display: flex; align-items: center; gap: 6px; margin-left: auto;
                    }
                    .audio-volume i { color: rgba(255,255,255,0.6); font-size: 0.9rem; cursor: pointer; }
                    .audio-volume input[type="range"] {
                        width: 70px; height: 4px; -webkit-appearance: none; appearance: none;
                        background: rgba(255,255,255,0.2); border-radius: 2px; outline: none;
                    }
                    .audio-volume input[type="range"]::-webkit-slider-thumb {
                        -webkit-appearance: none; width: 12px; height: 12px;
                        border-radius: 50%; background: #E8611D; cursor: pointer;
                    }
                    .audio-download {
                        display: inline-flex; align-items: center; gap: 6px;
                        color: rgba(255,255,255,0.6); font-size: 0.8rem; text-decoration: none;
                        padding: 6px 12px; border-radius: 8px;
                        border: 1px solid rgba(255,255,255,0.15); transition: all 0.2s;
                    }
                    .audio-download:hover {
                        color: #fff; border-color: #E8611D; background: rgba(232,97,29,0.15);
                    }
                    .audio-eq {
                        display: flex; align-items: flex-end; gap: 2px; height: 20px;
                    }
                    .audio-eq span {
                        width: 3px; border-radius: 2px; background: #E8611D;
                        animation: none;
                    }
                    .audio-eq.active span { animation: eqBounce 0.6s ease-in-out infinite alternate; }
                    .audio-eq span:nth-child(1) { height: 8px; animation-delay: 0s; }
                    .audio-eq span:nth-child(2) { height: 14px; animation-delay: 0.1s; }
                    .audio-eq span:nth-child(3) { height: 6px; animation-delay: 0.2s; }
                    .audio-eq span:nth-child(4) { height: 18px; animation-delay: 0.3s; }
                    .audio-eq span:nth-child(5) { height: 10px; animation-delay: 0.15s; }
                    @keyframes eqBounce {
                        0% { height: 4px; }
                        100% { height: 20px; }
                    }
                    @media (max-width: 576px) {
                        .audio-volume { display: none; }
                        .audio-player { padding: 16px; }
                    }
                </style>

                <div class="audio-player">
                    <div class="audio-player-header">
                        <div class="audio-player-icon"><i class="bi bi-music-note-beamed"></i></div>
                        <div class="audio-player-info">
                            <h6 th:text="${product.name}">Track Name</h6>
                            <small th:text="${store != null ? store.name : 'Unknown Artist'}">Artist</small>
                        </div>
                        <div class="audio-eq" id="audioEq">
                            <span></span><span></span><span></span><span></span><span></span>
                        </div>
                        <a th:href="@{'/uploads/products/audio/' + ${product.audiourl}}" download class="audio-download ms-auto">
                            <i class="bi bi-download"></i> Download
                        </a>
                    </div>

                    <div id="waveform" class="audio-waveform"></div>

                    <div class="audio-time">
                        <span id="currentTime">0:00</span>
                        <span id="totalTime">0:00</span>
                    </div>

                    <div class="audio-controls">
                        <button id="playPause" class="audio-play-btn" title="Play">
                            <i class="bi bi-play-fill"></i>
                        </button>
                        <div class="audio-progress-wrap" id="audioProgressWrap" style="cursor:pointer;">
                            <div style="height:4px;background:rgba(255,255,255,0.15);border-radius:2px;position:relative;">
                                <div id="audioProgress" style="height:100%;background:linear-gradient(90deg,#E8611D,#ff8c42);border-radius:2px;width:0%;transition:width 0.1s;"></div>
                            </div>
                        </div>
                        <div class="audio-volume">
                            <i class="bi bi-volume-up" id="volumeIcon"></i>
                            <input type="range" id="volumeSlider" min="0" max="100" value="80">
                        </div>
                    </div>
                </div>
            </div>

            <!-- WaveSurfer JS -->
            <script src="https://unpkg.com/wavesurfer.js"></script>
            <script th:inline="javascript">
                document.addEventListener('DOMContentLoaded', () => {
                    const audioUrl = /*[[${product.audiourl}]]*/ null;
                    if(audioUrl){
                        const wavesurfer = WaveSurfer.create({
                            container: '#waveform',
                            waveColor: 'rgba(255,255,255,0.2)',
                            progressColor: '#E8611D',
                            cursorColor: '#ff8c42',
                            barWidth: 3,
                            barGap: 2,
                            barRadius: 3,
                            responsive: true,
                            height: 70
                        });

                        wavesurfer.load('/uploads/products/audio/' + audioUrl);

                        const playPauseBtn = document.getElementById('playPause');
                        const currentTimeEl = document.getElementById('currentTime');
                        const totalTimeEl = document.getElementById('totalTime');
                        const progressBar = document.getElementById('audioProgress');
                        const progressWrap = document.getElementById('audioProgressWrap');
                        const volumeSlider = document.getElementById('volumeSlider');
                        const volumeIcon = document.getElementById('volumeIcon');
                        const audioEq = document.getElementById('audioEq');
                        let isPlaying = false;

                        wavesurfer.setVolume(0.8);

                        playPauseBtn.addEventListener('click', () => {
                            wavesurfer.playPause();
                        });

                        wavesurfer.on('play', () => {
                            isPlaying = true;
                            playPauseBtn.innerHTML = '<i class="bi bi-pause-fill"></i>';
                            playPauseBtn.classList.add('playing');
                            playPauseBtn.title = 'Pause';
                            audioEq.classList.add('active');
                        });

                        wavesurfer.on('pause', () => {
                            isPlaying = false;
                            playPauseBtn.innerHTML = '<i class="bi bi-play-fill"></i>';
                            playPauseBtn.classList.remove('playing');
                            playPauseBtn.title = 'Play';
                            audioEq.classList.remove('active');
                            currentTimeEl.textContent = formatTime(wavesurfer.getCurrentTime());
                        });

                        wavesurfer.on('ready', () => {
                            totalTimeEl.textContent = formatTime(wavesurfer.getDuration());
                        });

                        wavesurfer.on('audioprocess', () => {
                            const current = wavesurfer.getCurrentTime();
                            const duration = wavesurfer.getDuration();
                            currentTimeEl.textContent = formatTime(current);
                            if (duration > 0) {
                                progressBar.style.width = ((current / duration) * 100) + '%';
                            }
                        });

                        wavesurfer.on('finish', () => {
                            currentTimeEl.textContent = formatTime(wavesurfer.getDuration());
                            progressBar.style.width = '100%';
                            playPauseBtn.innerHTML = '<i class="bi bi-play-fill"></i>';
                            playPauseBtn.classList.remove('playing');
                            audioEq.classList.remove('active');
                        });

                        // Click on progress bar to seek
                        progressWrap.addEventListener('click', (e) => {
                            const rect = progressWrap.getBoundingClientRect();
                            const pct = (e.clientX - rect.left) / rect.width;
                            wavesurfer.seekTo(pct);
                        });

                        // Volume control
                        volumeSlider.addEventListener('input', (e) => {
                            const vol = e.target.value / 100;
                            wavesurfer.setVolume(vol);
                            if (vol === 0) volumeIcon.className = 'bi bi-volume-mute';
                            else if (vol < 0.5) volumeIcon.className = 'bi bi-volume-down';
                            else volumeIcon.className = 'bi bi-volume-up';
                        });

                        volumeIcon.addEventListener('click', () => {
                            if (wavesurfer.getVolume() > 0) {
                                wavesurfer.setVolume(0);
                                volumeSlider.value = 0;
                                volumeIcon.className = 'bi bi-volume-mute';
                            } else {
                                wavesurfer.setVolume(0.8);
                                volumeSlider.value = 80;
                                volumeIcon.className = 'bi bi-volume-up';
                            }
                        });

                        function formatTime(seconds){
                            const minutes = Math.floor(seconds / 60);
                            const secs = Math.floor(seconds % 60);
                            return minutes + ':' + (secs < 10 ? '0' + secs : secs);
                        }
                    }
                });
            </script>




            <div class="d-flex justify-content-center gap-2 mt-3 mb-4">
            <!-- Like / Dislike Buttons -->
            <div class="d-flex gap-2 my-3">
                <!-- Like -->
                <form id="likeForm"
                      th:action="@{'/product/' + ${product.id} + '/like'}"
                      method="post">
                    <button type="submit" class="btn btn-success">
                        👍 Like
                        <span id="likeCount"
                              class="badge bg-light text-dark"
                              th:text="${product.likes}">0</span>
                    </button>
                </form>

                <!-- Dislike -->
                <form id="dislikeForm"
                      th:action="@{'/product/' + ${product.id} + '/dislike'}"
                      method="post">
                    <button type="submit" class="btn btn-danger">
                        👎 Dislike
                        <span id="dislikeCount"
                              class="badge bg-light text-dark"
                              th:text="${product.dislikes}">0</span>
                    </button>
                </form>
            </div>
            </div>



            <script>
                document.addEventListener("DOMContentLoaded", () => {

                    function handleForm(formId, like = true) {
                        const form = document.getElementById(formId);

                        form.addEventListener("submit", function (e) {
                            e.preventDefault(); //  stop reload

                            fetch(form.action, {
                                method: "POST",
                                headers: {
                                    "X-Requested-With": "XMLHttpRequest"
                                }
                            })
                            .then(res => res.json())
                            .then(data => {
                                document.getElementById("likeCount").textContent = data.likes;
                                document.getElementById("dislikeCount").textContent = data.dislikes;
                            })
                            .catch(err => console.error(err));
                        });
                    }

                    handleForm("likeForm", true);
                    handleForm("dislikeForm", false);
                });
            </script>


        </div>



        <!-- Product Details -->
        <div class="col-md-6">


            <h3 th:text="${product.name}">Product Name</h3>

            <p class="price">
                <span th:text="${product.currency + ' ' + #numbers.formatDecimal(product.price, 1, 'COMMA', 0, 'POINT')}">0.00</span>
            </p>


            <hr>

            <h6>Description</h6>
            <p th:text="${product.description}" style="white-space: pre-wrap;"></p>

            <h6 class="d-flex justify-content-center mt-2" >Share</h6>
            <div class="d-flex justify-content-center mb-5">

            <!-- Facebook -->
            <a th:href="'https://www.facebook.com/sharer/sharer.php?u=' + ${currentUrl}" target="_blank" class="btn btn-primary btn-sm mx-1">
                <i class="bi bi-facebook me-1  "></i> Facebook
            </a>

            <!-- Twitter -->
            <a th:href="'https://twitter.com/intent/tweet?url=' + ${currentUrl} + '&text=' + ${product.name}" target="_blank" class="btn btn-info btn-sm text-white">
                <i class="bi bi-twitter me-1"></i> Twitter
            </a>

            <!-- WhatsApp -->
            <a th:href="'https://wa.me/?text=' + ${product.name + ' ' + currentUrl}" target="_blank" class="btn btn-success btn-sm mx-1">
                <i class="bi bi-whatsapp me-1"></i> WhatsApp
            </a>

            <!-- LinkedIn -->
            <a th:href="'https://www.linkedin.com/sharing/share-offsite/?url=' + ${currentUrl}" target="_blank" class="btn btn-secondary btn-sm">
                <i class="bi bi-linkedin me-1"></i> LinkedIn
            </a>
            </div>

            <!-- WhatsApp & Call Buttons -->
            <div class="d-flex justify-content-center gap-2 mt-3 mb-4">

                <a th:if="${store != null and store.whatsappNumber != null and store.whatsappNumber != ''}"
                   th:href="'https://wa.me/' + ${store.whatsappNumber}"
                   target="_blank"
                   class="btn btn-success btn-sm d-flex align-items-center">
                    <i class="bi bi-whatsapp me-1"></i> Chat on WhatsApp
                </a>

                <a th:if="${store != null and store.contactNumber != null and store.contactNumber != ''}"
                   th:href="'tel:' + ${store.contactNumber}"
                   class="btn btn-outline-primary btn-sm d-flex align-items-center">
                    <i class="bi bi-telephone me-1"></i> Call Seller
                </a>

            </div>


        </div>
    </div>

</div>




<style>
    .star-rating i {
    font-size: 1.4rem;
    cursor: pointer;
    color: #ccc;
}

.star-rating i.active {
    color: #F2B705;
}

</style>

<script th:inline="javascript">
    const productId = [[${product.id}]];
    const stars = document.querySelectorAll('#starRating i');

    stars.forEach(star => {
        star.addEventListener('click', () => {
            const rating = star.getAttribute('data-star');

            fetch(`/product/${productId}/rate`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: `stars=${rating}`
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById('ratingAvg').textContent = data.average;
                document.getElementById('ratingCount').textContent = data.count;

                stars.forEach(s => {
                    s.classList.toggle(
                        'active',
                        s.getAttribute('data-star') <= Math.round(data.average)
                    );
                });
            })
            .catch(console.error);
        });
    });
</script>




<!-- ================= SIMILAR PRODUCTS ================= -->
<!-- ================= SIMILAR PRODUCTS SLIDER ================= -->
<div class="container mt-5"
     th:if="${similarProducts != null and !similarProducts.isEmpty()}">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">Similar Products</h4>

        <!-- Controls -->
        <div>
            <button class="btn btn-sm btn-outline-secondary me-1"
                    onclick="scrollSimilar(-1)">
                ‹
            </button>
            <button class="btn btn-sm btn-outline-secondary"
                    onclick="scrollSimilar(1)">
                ›
            </button>
        </div>
    </div>

    <!-- Scroll Container -->
    <div class="similar-scroll-wrapper">
        <div class="similar-scroll">

            <div class="similar-item"
                 th:each="p : ${similarProducts}">

                <div class="card h-100 shadow-sm">
                    <a th:href="@{'/product/' + ${p.id}}">
                        <img loading="lazy" class="card-img-top"
                             th:src="@{'/uploads/products/images/' +
                             ${#strings.arraySplit(p.imageurls, ',')[0]}}"
                             style="height:180px; object-fit:contain;">
                    </a>

                    <div class="card-body p-2">
                        <h6 class="text-truncate" th:text="${p.name}"></h6>
                        <span class="text-success fw-bold"
                              th:text="${p.currency + ' ' + #numbers.formatDecimal(p.price, 1, 'COMMA', 0, 'POINT')}">
                        </span>
                    </div>
                </div>

            </div>

        </div>
    </div>
</div>

<style>
    .similar-scroll-wrapper {
    overflow: hidden;
    width: 100%;
}

.similar-scroll {
    display: flex;
    gap: 1rem;
    overflow-x: auto;
    scroll-behavior: smooth;
    padding-bottom: 10px;
}

.similar-scroll::-webkit-scrollbar {
    display: none;
}

.similar-item {
    min-width: 250px;
    max-width: 250px;
    flex: 0 0 auto;
}

</style>

<script>
    function scrollSimilar(direction) {
        const container = document.querySelector('.similar-scroll');
        const scrollAmount = 300;
        container.scrollBy({
            left: direction * scrollAmount,
            behavior: 'smooth'
        });
    }
</script>



<script>
    function showSlide(index) {
        const carousel = document.querySelector('#productCarousel');
        const bsCarousel = bootstrap.Carousel.getOrCreateInstance(carousel);
        bsCarousel.to(index);
    }
</script>



<script th:inline="javascript">
    const productId = [[${product.id}]]; // Thymeleaf replaces this with the real ID

    document.getElementById('likeBtn').addEventListener('click', () => {
        fetch(`/product/${productId}/like`, {
            method: 'POST'
        })
        .then(res => res.json())
        .then(data => {
            document.getElementById('likeCount').textContent = data.likes;
            document.getElementById('dislikeCount').textContent = data.dislikes;
        })
        .catch(err => console.error(err));
    });

    document.getElementById('dislikeBtn').addEventListener('click', () => {
        fetch(`/product/${productId}/dislike`, {
            method: 'POST'
        })
        .then(res => res.json())
        .then(data => {
            document.getElementById('likeCount').textContent = data.likes;
            document.getElementById('dislikeCount').textContent = data.dislikes;
        })
        .catch(err => console.error(err));
    });
</script>
